<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="illus.css">
<style>
  body { width: 390px; height: 844px; background: #141414; color: #eee7db; font-family: Inter, sans-serif; padding: 22px 20px; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 26px; }
  .logo { font: 400 26px/1 'Bebas Neue', sans-serif; letter-spacing: .08em; }
  .logo b { font-weight: 400; color: #b48a52; }
  .back { font-size: 13px; color: #b9b1a5; }
  h1 { font: 400 54px/0.9 'Bebas Neue', sans-serif; margin-bottom: 6px; }
  .when { font-size: 14px; color: #b9b1a5; margin-bottom: 22px; }
  .days { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 20px; }
  .days div { text-align: center; padding: 10px 0; border-radius: 12px; border: 1px solid rgba(238,231,219,.12); font-size: 12px; color: #b9b1a5; }
  .days b { display: block; font-size: 18px; color: #eee7db; margin-top: 2px; }
  .days .on { background: #b48a52; border-color: #b48a52; color: #141414; }
  .days .on b { color: #141414; }
  .label { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #8f877c; margin: 6px 0 10px; }
  .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 22px; }
  .slots span { text-align: center; padding: 12px 0; border-radius: 12px; border: 1px solid rgba(238,231,219,.12); font-size: 15px; }
  .slots .off { color: #5c5650; text-decoration: line-through; }
  .slots .on { border-color: #b48a52; color: #b48a52; font-weight: 600; }
  .summary { padding: 16px; border-radius: 16px; background: #1d1c1b; border: 1px solid rgba(238,231,219,.1); margin-bottom: 14px; font-size: 14px; color: #b9b1a5; }
  .summary div { display: flex; justify-content: space-between; padding: 5px 0; }
  .summary b { color: #eee7db; font-weight: 500; }
  .btn { display: block; text-align: center; padding: 17px; border-radius: 14px; background: #eee7db; color: #141414; font-weight: 600; }
</style></head><body>
  <div class="bar"><span class="back">‹ Back</span><span class="logo">Oak <b>&amp;</b> Iron</span><span class="back">Help</span></div>
  <h1>Pick a time</h1>
  <div class="when">Cut &amp; beard with Jordan · 55 min</div>
  <div class="days"><div>Mon<b>9</b></div><div class="on">Tue<b>10</b></div><div>Wed<b>11</b></div><div>Thu<b>12</b></div><div>Fri<b>13</b></div></div>
  <div class="label">Afternoon</div>
  <div class="slots"><span class="off">13:30</span><span class="on">14:15</span><span>15:00</span><span class="off">15:45</span><span>16:30</span><span>17:15</span></div>
  <div class="summary"><div><span>Service</span><b>Cut &amp; beard</b></div><div><span>Barber</span><b>Jordan</b></div><div><span>When</span><b>Tue 10, 14:15</b></div><div><span>Price</span><b>£32</b></div></div>
  <span class="btn">Confirm booking</span>
</body></html>
