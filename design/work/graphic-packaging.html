<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="illus.css">
<style>
  body { width: 1600px; height: 1000px; background: radial-gradient(ellipse at 50% 40%, #a5b296, #7f8f72 70%); display: flex; align-items: center; justify-content: center; gap: 70px; font-family: Inter, sans-serif; color: #2a1c14; }
  .bag { transform: scale(1.55); margin: 0 60px; }
  .bag.b2 { transform: scale(1.55) rotate(4deg); }
  .label .lname { font: 600 30px/1 Fraunces, serif; letter-spacing: -.02em; }
  .label .origin { font: italic 400 22px/1.15 Fraunces, serif; }
  .label .meta { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #6b4430; }
  .label .notes { font-size: 11px; line-height: 1.5; color: #5a4636; }
  .label hr { width: 40px; border: 0; border-top: 1px solid #c9865a; }
  .back .label { justify-content: flex-start; gap: 10px; text-align: left; align-items: stretch; padding: 22px 18px; }
  .back h4 { font: 600 16px Fraunces, serif; }
  .back .rowk { display: flex; justify-content: space-between; font-size: 10.5px; padding: 4px 0; border-bottom: 1px solid rgba(42,28,20,.12); }
  .back .rowk span:first-child { color: #6b4430; }
  .back .brew { font-size: 10.5px; line-height: 1.5; color: #5a4636; }
  .stamp { width: 54px; height: 54px; border-radius: 50%; border: 1px solid #c9865a; display: grid; place-items: center; font: italic 400 11px/1.1 Fraunces, serif; text-align: center; color: #6b4430; align-self: flex-end; }
</style></head><body>
  <div class="bag"><div class="label"><div class="lname">norde</div><div class="origin">Colombia<br>Huila</div><hr><div class="meta">Washed · 250g</div><div class="notes">Red apple, panela<br>&amp; cocoa nib</div></div></div>
  <div class="bag b2 back"><div class="label"><h4>About this coffee</h4>
    <div class="rowk"><span>Producer</span><span>La Esperanza co-op</span></div>
    <div class="rowk"><span>Altitude</span><span>1,750 m</span></div>
    <div class="rowk"><span>Variety</span><span>Caturra, Castillo</span></div>
    <div class="rowk"><span>Roasted</span><span>__ / __ / __</span></div>
    <p class="brew">Brew: 15 g to 250 ml at 94°C. Rest for four minutes, then enjoy.</p>
    <div class="stamp">roasted<br>by hand</div>
  </div></div>
</body></html>
