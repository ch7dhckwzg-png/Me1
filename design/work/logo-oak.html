<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="illus.css">
<style>
  body { width: 1200px; height: 900px; background: #141414; color: #eee7db; font-family: Inter, sans-serif; display: grid; grid-template-rows: 1fr auto; }
  .main { display: grid; place-items: center; }
  .foot { display: flex; justify-content: space-between; align-items: center; padding: 34px 56px; border-top: 1px solid rgba(238,231,219,.12); font-size: 15px; }
  .sw { display: flex; gap: 10px; }
  .sw i { width: 30px; height: 30px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  .type { opacity: .7 }
  .badge{position:relative;width:440px;height:440px;border-radius:50%;border:3px solid #b48a52;display:grid;place-items:center}.badge::before{content:'';position:absolute;inset:16px;border-radius:50%;border:1px solid rgba(180,138,82,.5)}.word{font:400 112px/0.86 'Bebas Neue',sans-serif;text-align:center;letter-spacing:.04em}.word b{font-weight:400;color:#b48a52;display:block;font-size:80px}.est{position:absolute;bottom:62px;font:500 15px Inter;letter-spacing:.4em;color:#b48a52}.top{position:absolute;top:62px;font:500 15px Inter;letter-spacing:.4em;color:#b48a52}
</style></head><body>
  <div class="main"><div class="badge"><span class="top">BARBERS</span><div class="word">Oak<b>&amp;</b>Iron</div><span class="est">EST. 2024</span></div></div>
  <div class="foot"><span class="type">Bebas Neue &amp; Inter · Barbers</span><div class="sw"><i style="background:#141414"></i><i style="background:#2a2a2a"></i><i style="background:#b48a52"></i><i style="background:#d8c2a0"></i><i style="background:#eee7db"></i></div></div>
</body></html>
