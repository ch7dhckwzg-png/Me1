<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="illus.css">
<style>
  body { width: 1800px; height: 1000px; background: #d8cfc6; display: flex; align-items: center; justify-content: center; gap: 44px; font-family: 'DM Sans', sans-serif; }
  .post { position: relative; width: 520px; height: 520px; overflow: hidden; box-shadow: 0 40px 60px -30px rgba(29,25,22,.45); }
  .p1 { background: #1d1916; color: #ece6df; padding: 54px; display: flex; flex-direction: column; justify-content: space-between; }
  .p1 h2 { font: 400 92px/0.92 'Cormorant Garamond', serif; }
  .p1 h2 em { color: #e9cdbf; }
  .p1 .steps { display: flex; gap: 10px; }
  .p1 .steps span { padding: 9px 16px; border: 1px solid rgba(236,230,223,.3); border-radius: 6px; font-size: 15px; }
  .p2 { background: #ece6df; color: #1d1916; }
  .p2 .big { position: absolute; left: 44px; top: 40px; font: 400 230px/0.8 'Cormorant Garamond', serif; color: #e2c3b3; }
  .p2 .big .pc { font-size: 110px; margin-left: 6px; vertical-align: 92px; }
  .p2 .txt { position: absolute; left: 50px; bottom: 50px; right: 210px; }
  .p2 .txt b { display: block; font: 500 40px/1 'Cormorant Garamond', serif; margin-bottom: 10px; }
  .p2 .txt span { font-size: 16px; line-height: 1.5; color: #5b5048; }
  .p2 .dropper { position: absolute; right: 56px; bottom: 50px; transform: scale(1.05); transform-origin: bottom right; }
  .p3 { background: linear-gradient(#e9cdbf, #dbb9a7); display: grid; place-items: center; }
  .p3 .jar { transform: scale(1.5); margin-top: 40px; }
  .p3 .new { position: absolute; top: 44px; left: 0; right: 0; text-align: center; font-size: 14px; letter-spacing: .3em; text-transform: uppercase; color: #6d5446; }
  .p3 h3 { position: absolute; bottom: 44px; left: 0; right: 0; text-align: center; font: italic 400 54px/1 'Cormorant Garamond', serif; color: #1d1916; }
  .pname { font: 600 15px/1 'Cormorant Garamond', serif; letter-spacing: .3em; }
  .pkind { font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: #8c7b6e; margin-top: 6px; }
  .handle { position: absolute; top: 22px; right: 26px; font-size: 13px; opacity: .6; }
</style></head><body>
  <div class="post p1"><span class="handle">@lumenskin</span><h2>Three steps.<br><em>That’s it.</em></h2><div class="steps"><span>Cleanse</span><span>Treat</span><span>Nourish</span></div></div>
  <div class="post p2"><div class="big">5<span class="pc">%</span></div><div class="txt"><b>Niacinamide</b><span>Calms redness and refines pores. You’ll find it in Serum 02.</span></div><div class="dropper"><div class="cap"></div><div class="collar"></div><div class="glass"><div class="prod-label"><div class="pname">LUMEN</div><div class="pkind">Serum 02</div></div></div></div></div>
  <div class="post p3"><div class="new">New in the ritual</div><div class="jar"><div class="lid"></div><div class="pot"><div class="prod-label"><div class="pname">LUMEN</div><div class="pkind">Night balm</div></div></div></div><h3>Night balm</h3></div>
</body></html>
