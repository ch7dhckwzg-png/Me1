<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="illus.css">
<style>
  body { width: 390px; height: 844px; background: #f3ece1; color: #2a1c14; font-family: Inter, sans-serif; }
  .bar { display: flex; justify-content: space-between; align-items: center; padding: 22px 22px 10px; }
  .brand { display: flex; align-items: center; gap: 8px; font: 600 24px/1 Fraunces, serif; letter-spacing: -0.02em; }
  .burger { width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(42,28,20,.2); display: grid; place-content: center; gap: 5px; }
  .burger i { display: block; width: 16px; height: 1.6px; background: #2a1c14; }
  .art { position: relative; height: 330px; margin-top: 6px; }
  .disc { position: absolute; left: 50%; top: 18px; width: 290px; height: 290px; margin-left: -145px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #9aa98c, #7f8f72 60%, #6e7d62); }
  .art .bag { position: absolute; left: 92px; top: 18px; transform: scale(0.68) rotate(-4deg); transform-origin: top left; }
  .art .cup { position: absolute; right: 26px; bottom: 6px; transform: scale(0.55); transform-origin: bottom right; }
  .label .lname { font: 600 30px/1 Fraunces, serif; }
  .label .origin { font: italic 22px/1.15 Fraunces, serif; }
  .label .meta { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #6b4430; }
  .label .notes { font-size: 12px; line-height: 1.5; color: #5a4636; }
  .label hr { width: 40px; border: 0; border-top: 1px solid #c9865a; }
  .copy { padding: 8px 22px 0; }
  h1 { font: 400 52px/0.98 Fraunces, serif; letter-spacing: -0.03em; margin-bottom: 14px; }
  h1 em { color: #6b4430; }
  p { font-size: 15px; line-height: 1.55; color: #5a4636; margin-bottom: 20px; }
  .btn { display: block; text-align: center; padding: 16px; border-radius: 99px; font-size: 15px; font-weight: 600; background: #2a1c14; color: #f7f2ea; margin-bottom: 10px; }
  .btn.line { background: none; color: #2a1c14; border: 1px solid rgba(42,28,20,.3); }
</style></head><body>
  <div class="bar">
    <div class="brand"><svg width="26" height="26" viewBox="0 0 34 34"><ellipse cx="17" cy="17" rx="12" ry="15" fill="#2a1c14" transform="rotate(28 17 17)"/><path d="M11 6 C 20 12, 14 22, 23 28" stroke="#f3ece1" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>norde</div>
    <div class="burger"><i></i><i></i></div>
  </div>
  <div class="art">
    <div class="disc"></div>
    <div class="bag"><div class="label"><div class="lname">norde</div><div class="origin">Ethiopia<br>Guji</div><hr><div class="meta">Washed · 250g</div><div class="notes">Peach, jasmine<br>&amp; wildflower honey</div></div></div>
    <div class="cup"></div>
  </div>
  <div class="copy">
    <h1>Coffee, roasted <em>slowly.</em></h1>
    <p>Seasonal single origins, roasted every Tuesday and posted while they’re at their best.</p>
    <span class="btn">Shop coffee</span>
    <span class="btn line">Start a subscription</span>
  </div>
</body></html>
