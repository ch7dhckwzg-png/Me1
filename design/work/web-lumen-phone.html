<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="illus.css">
<style>
  body { width: 390px; height: 844px; background: #ece6df; color: #1d1916; font-family: 'DM Sans', sans-serif; }
  .bar { display: flex; justify-content: space-between; align-items: center; padding: 22px 20px 12px; font-size: 13px; color: #5b5048; }
  .logo { font: 500 26px/1 'Cormorant Garamond', serif; letter-spacing: .34em; padding-left: .34em; color: #1d1916; }
  .stage { position: relative; height: 380px; margin: 4px 20px 0; border-radius: 200px 200px 0 0; background: linear-gradient(#e9cdbf, #dfc1b2); overflow: hidden; }
  .stage .dropper { position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%) scale(1.08); transform-origin: bottom center; }
  .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: linear-gradient(#f4eee8, #e2d8cd); }
  .pname { font: 600 15px/1 'Cormorant Garamond', serif; letter-spacing: .3em; }
  .pkind { font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: #8c7b6e; margin-top: 6px; }
  .info { padding: 22px 20px; }
  .crumbs { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #8c7b6e; margin-bottom: 10px; }
  h1 { font: 400 44px/1 'Cormorant Garamond', serif; margin-bottom: 8px; }
  .meta { display: flex; justify-content: space-between; font-size: 15px; color: #5b5048; margin-bottom: 18px; }
  .sizes { display: flex; gap: 8px; margin-bottom: 18px; }
  .sizes span { flex: 1; text-align: center; padding: 11px; border: 1px solid rgba(29,25,22,.25); font-size: 13px; }
  .sizes .on { border-color: #1d1916; background: #1d1916; color: #f6f1eb; }
  .btn { display: block; text-align: center; padding: 17px; background: #1d1916; color: #f6f1eb; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }
</style></head><body>
  <div class="bar"><span>Menu</span><span class="logo">LUMEN</span><span>Bag (1)</span></div>
  <div class="stage"><div class="floor"></div><div class="dropper"><div class="cap"></div><div class="collar"></div><div class="glass"><div class="prod-label"><div class="pname">LUMEN</div><div class="pkind">Serum 02</div></div></div></div></div>
  <div class="info">
    <div class="crumbs">Step two · Treat</div>
    <h1>Serum 02</h1>
    <div class="meta"><span>Niacinamide + squalane</span><span>£34</span></div>
    <div class="sizes"><span>15 ml</span><span class="on">30 ml</span><span>50 ml</span></div>
    <span class="btn">Add to bag</span>
  </div>
</body></html>
